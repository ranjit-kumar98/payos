# Nginx configuration for PayOS reverse proxy
#
# Routes:
# /api/ -> FastAPI backend (backend:8000)
# /ws/  -> Node.js notification service (notification_service:3001)
# everything else -> React frontend (frontend:3000)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ------------------------------------------------------------
    # Request size limit
    # ------------------------------------------------------------
    client_max_body_size 10m;

    # ------------------------------------------------------------
    # Upstream services
    # ------------------------------------------------------------
    upstream backend {
        server backend:8000;
    }

    upstream notification_service {
        server notification_service:3001;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        # --------------------------------------------------------
        # FastAPI backend
        # /api/* -> backend:8000
        # --------------------------------------------------------
        location /api/ {
            rewrite ^/api/(health|health/db)$ /$1 break;
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Normal HTTP proxy timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------
        # WebSocket health endpoint
        # --------------------------------------------------------
        location /ws/health {
            proxy_pass http://notification_service/health;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------
        # WebSocket service
        # /ws -> notification_service:3001
        # --------------------------------------------------------
        location /ws {
            proxy_pass http://notification_service;

            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long-lived WebSocket connection
            proxy_connect_timeout 10s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # --------------------------------------------------------
        # React frontend
        # Everything else -> frontend:3000
        # --------------------------------------------------------
        location / {
            proxy_pass http://frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}